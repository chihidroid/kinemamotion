<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>KinemaMotion - AI Posture Assessment</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Posture AI">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    body { background-color: #000; color: #f8fafc; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
    .onform-glass { background: rgba(15, 23, 42, 0.90); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    .safe-top { padding-top: max(8px, env(safe-area-inset-top)); }
    .safe-bottom { padding-bottom: max(12px, env(safe-area-inset-bottom)); }
  </style>
</head>
<body class="h-[100dvh] w-screen flex flex-col justify-between overflow-hidden font-sans">

  <!-- TOP HEADER -->
  <header class="w-full z-30 onform-glass border-b border-slate-800/80 px-4 py-2 safe-top flex items-center justify-between shrink-0">
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 rounded-lg bg-emerald-500 flex items-center justify-center font-black text-xs text-black">PA</div>
      <div class="flex flex-col">
        <span class="text-xs font-bold leading-none text-white">Posture AI カルテ</span>
        <span id="stepTitle" class="text-[9px] text-emerald-400 font-mono font-bold">STEP 1: 正面立位の撮影</span>
      </div>
    </div>

    <!-- グリッド表示トグル & カメラ反転 -->
    <div class="flex items-center gap-2">
      <button id="toggleGridBtn" class="px-2.5 py-1 rounded bg-slate-800 text-[11px] font-bold text-slate-300 border border-slate-700">
        方眼グリッド: ON
      </button>
      <button id="flipCamBtn" class="p-1.5 rounded-lg bg-slate-800 text-emerald-400 border border-slate-700 active:scale-95 transition-transform">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
      </button>
    </div>
  </header>

  <!-- MAIN VIEWPORT -->
  <main class="flex-1 relative w-full min-h-0 flex items-center justify-center bg-black overflow-hidden">
    <video id="inputVideo" class="hidden" autoplay playsinline muted></video>
    <canvas id="outputCanvas" class="w-full h-full object-contain max-h-full"></canvas>

    <!-- ロード画面 -->
    <div id="loadingStatus" class="absolute inset-0 bg-black/90 flex flex-col items-center justify-center text-emerald-400 text-xs gap-3 z-40">
      <div class="w-8 h-8 border-2 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
      <span class="font-mono">姿勢推定AIエンジン起動中...</span>
    </div>

    <!-- 撮影ガイダンス枠 -->
    <div class="absolute inset-y-6 inset-x-8 sm:inset-y-10 sm:inset-x-36 border-2 border-dashed border-emerald-500/40 rounded-3xl pointer-events-none flex flex-col items-center justify-between p-3 z-20">
      <div id="guideInstruction" class="px-3 py-1 rounded-full bg-emerald-950/90 text-emerald-300 border border-emerald-600 text-[11px] font-bold tracking-wide backdrop-blur">
        全身を中心線に合わせてリラックスして立ってください
      </div>
      <div class="text-[9px] text-slate-500 font-mono tracking-widest">PLUMB LINE CALIBRATION</div>
      <div class="px-2 py-0.5 rounded bg-black/60 text-slate-400 text-[10px] font-mono">足元を中央線に合わせる</div>
    </div>
  </main>

  <!-- BOTTOM CONTROL BAR -->
  <footer class="w-full z-30 onform-glass border-t border-slate-800/80 px-6 py-3 safe-bottom flex items-center justify-between shrink-0">
    <button id="resetBtn" class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-400 hover:text-white text-xs border border-slate-700">
      リセット
    </button>

    <!-- 写真撮影シャッター -->
    <div class="flex items-center justify-center">
      <button id="shutterBtn" class="w-14 h-14 rounded-full border-4 border-slate-300 flex items-center justify-center shadow-lg active:scale-95 transition-all">
        <div class="w-10 h-10 rounded-full bg-emerald-500 transition-all"></div>
      </button>
    </div>

    <span id="stepCounter" class="text-xs font-mono font-bold text-slate-300">1 / 2</span>
  </footer>

  <!-- ========================================== -->
  <!-- 撮影後プレビュー & カウンセリングモーダル    -->
  <!-- ========================================== -->
  <div id="previewModal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex-col justify-between overflow-y-auto p-4 safe-top safe-bottom">
    <div class="w-full max-w-xl mx-auto bg-slate-900 border border-slate-700 rounded-2xl p-5 flex flex-col gap-4 shadow-2xl">
      <!-- プレビューヘッダー -->
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <div>
          <span class="text-[10px] font-bold text-emerald-400 font-mono">POSTURE RESULT</span>
          <h2 class="text-base font-bold text-white">姿勢アライメント診断結果</h2>
        </div>
        <button id="closePreviewBtn" class="text-xs text-slate-400 hover:text-white px-2.5 py-1 rounded bg-slate-800">
          閉じる
        </button>
      </div>

      <!-- 写真 2面プレビュー（画像本来のアスペクト比を100%保持） -->
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-slate-950 p-2 rounded-xl border border-slate-800 flex flex-col items-center">
          <span class="text-[10px] font-bold text-emerald-400 mb-1.5">正面立位</span>
          <img id="prevFrontImg" class="w-full h-auto max-h-56 object-contain rounded-lg border border-slate-800 bg-black" />
        </div>
        <div class="bg-slate-950 p-2 rounded-xl border border-slate-800 flex flex-col items-center">
          <span class="text-[10px] font-bold text-emerald-400 mb-1.5">側面立位</span>
          <img id="prevSagittalImg" class="w-full h-auto max-h-56 object-contain rounded-lg border border-slate-800 bg-black" />
        </div>
      </div>

      <!-- 診断数値テーブル -->
      <div class="bg-slate-950 rounded-xl border border-slate-800 overflow-hidden text-xs">
        <div class="grid grid-cols-3 p-2.5 bg-slate-900/60 font-bold text-slate-400 border-b border-slate-800">
          <span>評価項目</span>
          <span class="text-center">測定値</span>
          <span class="text-right">判定</span>
        </div>
        <div class="grid grid-cols-3 p-2.5 border-b border-slate-800/60">
          <span class="text-slate-300">頭部側方傾斜</span>
          <span id="prevHeadVal" class="text-center font-mono font-bold text-white">-</span>
          <span id="prevHeadEval" class="text-right font-bold text-emerald-400">良好</span>
        </div>
        <div class="grid grid-cols-3 p-2.5 border-b border-slate-800/60">
          <span class="text-slate-300">肩峰 水平傾斜</span>
          <span id="prevShoulderVal" class="text-center font-mono font-bold text-white">-</span>
          <span id="prevShoulderEval" class="text-right font-bold text-emerald-400">良好</span>
        </div>
        <div class="grid grid-cols-3 p-2.5 border-b border-slate-800/60">
          <span class="text-slate-300">骨盤 水平傾斜</span>
          <span id="prevPelvisVal" class="text-center font-mono font-bold text-white">-</span>
          <span id="prevPelvisEval" class="text-right font-bold text-emerald-400">良好</span>
        </div>
        <div class="grid grid-cols-3 p-2.5">
          <span class="text-slate-300">耳-肩 前方偏位</span>
          <span id="prevForwardVal" class="text-center font-mono font-bold text-white">-</span>
          <span id="prevForwardEval" class="text-right font-bold text-emerald-400">適正</span>
        </div>
      </div>

      <!-- 総合評価 -->
      <div class="p-3 rounded-xl bg-emerald-950/40 border border-emerald-800/60 flex items-center justify-between">
        <span class="text-xs text-slate-300">総合姿勢タイプ</span>
        <span id="prevTypeVal" class="text-xs font-bold text-emerald-400">理想的アライメント</span>
      </div>

      <!-- アクションボタン -->
      <div class="flex items-center gap-3 pt-2">
        <button id="retakeBtn" class="flex-1 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold transition-all">
          撮り直す
        </button>
        <button id="downloadPdfBtn" class="flex-1 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold transition-all shadow-lg flex items-center justify-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
          PDFカルテを出力・保存
        </button>
      </div>
    </div>
  </div>

  <script>
    class AudioEngine {
      constructor() { this.ctx = null; }
      init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }
      shutterSound() {
        try {
          this.init();
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.exponentialRampToValueAtTime(400, now + 0.08);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(now); osc.stop(now + 0.09);
        } catch(e) {}
      }
    }
    const audio = new AudioEngine();

    const videoElement = document.getElementById('inputVideo');
    const canvasElement = document.getElementById('outputCanvas');
    const canvasCtx = canvasElement.getContext('2d');
    const loadingStatus = document.getElementById('loadingStatus');

    let currentStep = 1;
    let facingUser = false;
    let showGrid = true;
    let activeStream = null;
    let animFrameId = null;
    let isPoseRunning = false;

    let frontSnapshot = null;
    let sagittalSnapshot = null;
    let currentMetrics = {
      headTilt: 0,
      shoulderTilt: 0,
      pelvisTilt: 0,
      forwardHeadCm: 0,
      postureType: '理想的アライメント'
    };

    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/${file}`
    });
    pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });

    pose.onResults((results) => {
      loadingStatus.classList.add('hidden');
      isPoseRunning = false;

      if (videoElement.videoWidth && canvasElement.width !== videoElement.videoWidth) {
        canvasElement.width = videoElement.videoWidth;
        canvasElement.height = videoElement.videoHeight;
      }
      const w = canvasElement.width;
      const h = canvasElement.height;

      canvasCtx.drawImage(results.image, 0, 0, w, h);

      if (showGrid) {
        drawGridAndPlumbLine(w, h);
      }

      if (results.poseLandmarks) {
        const lm = results.poseLandmarks;
        const lEye = lm[2], rEye = lm[5];
        const lEar = lm[7], rEar = lm[8];
        const lShoulder = lm[11], rShoulder = lm[12];
        const lHip = lm[23], rHip = lm[24];
        const lAnkle = lm[27], rAnkle = lm[28];

        if (currentStep === 1) {
          const eyeTilt = Math.abs(Math.atan2(rEye.y - lEye.y, rEye.x - lEye.x) * 180 / Math.PI);
          const shoulderTilt = Math.abs(Math.atan2(rShoulder.y - lShoulder.y, rShoulder.x - lShoulder.x) * 180 / Math.PI);
          const pelvisTilt = Math.abs(Math.atan2(rHip.y - lHip.y, rHip.x - lHip.x) * 180 / Math.PI);

          currentMetrics.headTilt = eyeTilt;
          currentMetrics.shoulderTilt = shoulderTilt;
          currentMetrics.pelvisTilt = pelvisTilt;

          drawLine(lShoulder, rShoulder, shoulderTilt <= 2.0 ? '#10b981' : '#f59e0b', w, h);
          drawLine(lHip, rHip, pelvisTilt <= 2.0 ? '#10b981' : '#f59e0b', w, h);

          drawTag((lShoulder.x + rShoulder.x)/2 * w, (lShoulder.y + rShoulder.y)/2 * h - 20, `肩: ${shoulderTilt.toFixed(1)}°`);
          drawTag((lHip.x + rHip.x)/2 * w, (lHip.y + rHip.y)/2 * h - 20, `骨盤: ${pelvisTilt.toFixed(1)}°`);

        } else {
          const isRight = rHip.z < lHip.z;
          const ear = isRight ? rEar : lEar;
          const shoulder = isRight ? rShoulder : lShoulder;
          const hip = isRight ? rHip : lHip;
          const ankle = isRight ? rAnkle : lAnkle;

          const forwardHeadDist = (ear.x - shoulder.x) * w * 0.15;
          currentMetrics.forwardHeadCm = forwardHeadDist;

          [ear, shoulder, hip, ankle].forEach(pt => {
            canvasCtx.beginPath();
            canvasCtx.arc(pt.x * w, pt.y * h, 6, 0, 2 * Math.PI);
            canvasCtx.fillStyle = '#059669';
            canvasCtx.fill();
            canvasCtx.strokeStyle = '#fff';
            canvasCtx.stroke();
          });

          drawTag(ear.x * w + 15, ear.y * h, `耳-肩: ${Math.abs(forwardHeadDist).toFixed(1)}cm`);
        }
      }
    });

    function drawGridAndPlumbLine(w, h) {
      canvasCtx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
      canvasCtx.lineWidth = 1;
      const step = 40;
      for (let x = 0; x < w; x += step) {
        canvasCtx.beginPath(); canvasCtx.moveTo(x, 0); canvasCtx.lineTo(x, h); canvasCtx.stroke();
      }
      for (let y = 0; y < h; y += step) {
        canvasCtx.beginPath(); canvasCtx.moveTo(0, y); canvasCtx.lineTo(w, y); canvasCtx.stroke();
      }
      canvasCtx.strokeStyle = 'rgba(16, 185, 129, 0.7)';
      canvasCtx.lineWidth = 2.5;
      canvasCtx.setLineDash([6, 6]);
      canvasCtx.beginPath();
      canvasCtx.moveTo(w / 2, 0); canvasCtx.lineTo(w / 2, h);
      canvasCtx.stroke();
      canvasCtx.setLineDash([]);
    }

    function drawLine(p1, p2, color, w, h) {
      canvasCtx.beginPath();
      canvasCtx.moveTo(p1.x * w, p1.y * h);
      canvasCtx.lineTo(p2.x * w, p2.y * h);
      canvasCtx.strokeStyle = color;
      canvasCtx.lineWidth = 3;
      canvasCtx.stroke();
    }

    function drawTag(x, y, text) {
      canvasCtx.save();
      canvasCtx.font = 'bold 13px monospace';
      canvasCtx.fillStyle = 'rgba(15, 23, 42, 0.85)';
      canvasCtx.fillRect(x - 4, y - 12, 120, 22);
      canvasCtx.strokeStyle = '#10b981';
      canvasCtx.strokeRect(x - 4, y - 12, 120, 22);
      canvasCtx.fillStyle = '#fff';
      canvasCtx.fillText(text, x + 4, y + 4);
      canvasCtx.restore();
    }

    async function startCamera() {
      if (animFrameId) cancelAnimationFrame(animFrameId);
      if (activeStream) activeStream.getTracks().forEach(t => t.stop());

      loadingStatus.classList.remove('hidden');

      try {
        activeStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facingUser ? 'user' : 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        videoElement.srcObject = activeStream;
        await videoElement.play();

        function loop() {
          if (videoElement.readyState >= 2 && !videoElement.paused) {
            if (!isPoseRunning) {
              isPoseRunning = true;
              pose.send({ image: videoElement }).catch(() => { isPoseRunning = false; });
            }
          }
          animFrameId = requestAnimationFrame(loop);
        }
        loop();
      } catch (err) {
        console.error('Camera Launch Error:', err);
        loadingStatus.classList.add('hidden');
      }
    }
    startCamera();

    document.getElementById('flipCamBtn').addEventListener('click', () => {
      facingUser = !facingUser;
      canvasElement.style.transform = facingUser ? 'scaleX(-1)' : 'scaleX(1)';
      startCamera();
    });

    document.getElementById('toggleGridBtn').addEventListener('click', () => {
      showGrid = !showGrid;
      document.getElementById('toggleGridBtn').innerText = `方眼グリッド: ${showGrid ? 'ON' : 'OFF'}`;
    });

    // シャッター処理
    document.getElementById('shutterBtn').addEventListener('click', () => {
      audio.shutterSound();
      const photo = canvasElement.toDataURL('image/jpeg', 0.95);

      if (currentStep === 1) {
        frontSnapshot = photo;
        currentStep = 2;
        document.getElementById('stepTitle').innerText = 'STEP 2: 側面立位の撮影';
        document.getElementById('stepCounter').innerText = '2 / 2';
        document.getElementById('guideInstruction').innerText = '被検者は真横（側面）を向いて立ってください';
      } else {
        sagittalSnapshot = photo;
        showPreviewModal(); // 即保存ではなくプレビューを表示
      }
    });

    // プレビューモーダルの表示
    function showPreviewModal() {
      document.getElementById('prevFrontImg').src = frontSnapshot;
      document.getElementById('prevSagittalImg').src = sagittalSnapshot;

      document.getElementById('prevHeadVal').innerText = `${currentMetrics.headTilt.toFixed(1)}°`;
      document.getElementById('prevShoulderVal').innerText = `${currentMetrics.shoulderTilt.toFixed(1)}°`;
      document.getElementById('prevPelvisVal').innerText = `${currentMetrics.pelvisTilt.toFixed(1)}°`;
      document.getElementById('prevForwardVal').innerText = `${Math.abs(currentMetrics.forwardHeadCm).toFixed(1)} cm`;

      document.getElementById('prevHeadEval').innerText = currentMetrics.headTilt <= 1.5 ? '良好' : '要注意';
      document.getElementById('prevHeadEval').className = currentMetrics.headTilt <= 1.5 ? 'text-right font-bold text-emerald-400' : 'text-right font-bold text-amber-400';

      document.getElementById('prevShoulderEval').innerText = currentMetrics.shoulderTilt <= 2.0 ? '水平' : '左右差';
      document.getElementById('prevShoulderEval').className = currentMetrics.shoulderTilt <= 2.0 ? 'text-right font-bold text-emerald-400' : 'text-right font-bold text-amber-400';

      document.getElementById('prevPelvisEval').innerText = currentMetrics.pelvisTilt <= 2.0 ? '水平' : '傾斜';
      document.getElementById('prevPelvisEval').className = currentMetrics.pelvisTilt <= 2.0 ? 'text-right font-bold text-emerald-400' : 'text-right font-bold text-amber-400';

      const typeEl = document.getElementById('prevTypeVal');
      if (Math.abs(currentMetrics.forwardHeadCm) > 4.0) {
        currentMetrics.postureType = '頭部前方突出・スウェイバック傾向';
        typeEl.innerText = currentMetrics.postureType;
        typeEl.className = 'text-xs font-bold text-rose-400';
      } else if (currentMetrics.shoulderTilt > 2.5 || currentMetrics.pelvisTilt > 2.5) {
        currentMetrics.postureType = '前額面側方アライメント非対称型';
        typeEl.innerText = currentMetrics.postureType;
        typeEl.className = 'text-xs font-bold text-amber-400';
      } else {
        currentMetrics.postureType = '理想的アライメント';
        typeEl.innerText = currentMetrics.postureType;
        typeEl.className = 'text-xs font-bold text-emerald-400';
      }

      const modal = document.getElementById('previewModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    // ★ ピュアjsPDF直接描画エンジン（アスペクト比を100%保持・歪みゼロ）
    async function exportPurePdf() {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('p', 'mm', 'a4'); // A4: 210mm x 297mm

      // ヘッダー装飾
      pdf.setFillColor(5, 150, 105);
      pdf.rect(15, 15, 180, 2, 'F');

      pdf.setFontSize(8);
      pdf.setTextColor(5, 150, 105);
      pdf.text('STATIC POSTURE ASSESSMENT', 15, 23);

      pdf.setFontSize(16);
      pdf.setTextColor(15, 23, 42);
      pdf.text('AI Posture Alignment Report', 15, 30);

      pdf.setFontSize(8);
      pdf.setTextColor(100, 116, 139);
      pdf.text('Hyakutake Orthopedic Hospital Sports Division', 15, 35);[cite: 2, 7]
      pdf.text(`Date: ${new Date().toLocaleDateString('ja-JP')}  |  ID: PA-${Math.floor(1000 + Math.random() * 9000)}`, 130, 35);

      // 画像のピクセルサイズを取得して縦横比を完全固定で配置
      const getImageDimensions = (src) => new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve({ w: img.width, h: img.height });
        img.src = src;
      });

      const frontDim = await getImageDimensions(frontSnapshot);
      const sagDim = await getImageDimensions(sagittalSnapshot);

      // 写真エリアの最大枠（幅85mm、高さ110mm）
      const maxBoxW = 85;
      const maxBoxH = 110;

      // 前額面写真の縮尺計算
      const frontRatio = Math.min(maxBoxW / frontDim.w, maxBoxH / frontDim.h);
      const fW = frontDim.w * frontRatio;
      const fH = frontDim.h * frontRatio;
      const fX = 15 + (maxBoxW - fW) / 2;
      const fY = 42 + (maxBoxH - fH) / 2;

      // 矢状面写真の縮尺計算
      const sagRatio = Math.min(maxBoxW / sagDim.w, maxBoxH / sagDim.h);
      const sW = sagDim.w * sagRatio;
      const sH = sagDim.h * sagRatio;
      const sX = 110 + (maxBoxW - sW) / 2;
      const sY = 42 + (maxBoxH - sH) / 2;

      // 背景枠
      pdf.setFillColor(248, 250, 252);
      pdf.roundedRect(15, 42, maxBoxW, maxBoxH, 2, 2, 'F');
      pdf.roundedRect(110, 42, maxBoxW, maxBoxH, 2, 2, 'F');

      // 画像を本来の比率のまま埋め込み（歪みゼロ）[cite: 7]
      pdf.addImage(frontSnapshot, 'JPEG', fX, fY, fW, fH);
      pdf.addImage(sagittalSnapshot, 'JPEG', sX, sY, sW, sH);

      pdf.setFontSize(9);
      pdf.setTextColor(5, 150, 105);
      pdf.text('Frontal View', 15, 156);[cite: 7]
      pdf.text('Sagittal View', 110, 156);[cite: 7]

      // 測定テーブル
      pdf.setDrawColor(203, 213, 225);
      pdf.line(15, 162, 195, 162);

      pdf.setFontSize(10);
      pdf.setTextColor(15, 23, 42);
      pdf.text('Quantitative Metrics', 15, 170);

      pdf.setFontSize(9);
      pdf.setTextColor(71, 85, 105);
      const startY = 178;
      const metrics = [
        ['Head Lateral Tilt', `${currentMetrics.headTilt.toFixed(1)} deg`, currentMetrics.headTilt <= 1.5 ? 'Normal' : 'Caution'],
        ['Shoulder Horizontal Tilt', `${currentMetrics.shoulderTilt.toFixed(1)} deg`, currentMetrics.shoulderTilt <= 2.0 ? 'Normal' : 'Asymmetry'],
        ['Pelvis Horizontal Tilt', `${currentMetrics.pelvisTilt.toFixed(1)} deg`, currentMetrics.pelvisTilt <= 2.0 ? 'Normal' : 'Tilt'],
        ['Forward Head Translation', `${Math.abs(currentMetrics.forwardHeadCm).toFixed(1)} cm`, Math.abs(currentMetrics.forwardHeadCm) <= 3.0 ? 'Normal' : 'Forward']
      ];

      metrics.forEach((row, i) => {
        const y = startY + i * 8;
        pdf.text(row[0], 18, y);
        pdf.text(row[1], 100, y);
        pdf.text(row[2], 160, y);
        pdf.setDrawColor(241, 245, 249);
        pdf.line(15, y + 2, 195, y + 2);
      });

      // 総合タイプ
      pdf.setFillColor(241, 245, 249);
      pdf.roundedRect(15, 215, 180, 12, 2, 2, 'F');
      pdf.setFontSize(9);
      pdf.setTextColor(15, 23, 42);
      pdf.text('Classification:  ' + currentMetrics.postureType, 20, 223);

      // 所見枠[cite: 8]
      pdf.setDrawColor(203, 213, 225);
      pdf.roundedRect(15, 233, 180, 40, 2, 2, 'D');
      pdf.setFontSize(8);
      pdf.setTextColor(100, 116, 139);
      pdf.text('Clinical Findings & Exercise Prescription:', 18, 239);
      pdf.text('PT Signature: _______________________', 120, 268);[cite: 8]

      pdf.save(`posture_report_${Date.now()}.pdf`);
    }

    // PDF保存ボタン
    document.getElementById('downloadPdfBtn').addEventListener('click', async () => {
      await exportPurePdf();
    });

    // 撮り直し
    document.getElementById('retakeBtn').addEventListener('click', () => {
      document.getElementById('previewModal').classList.add('hidden');
      document.getElementById('previewModal').classList.remove('flex');
      resetPostureSession();
    });

    document.getElementById('closePreviewBtn').addEventListener('click', () => {
      document.getElementById('previewModal').classList.add('hidden');
      document.getElementById('previewModal').classList.remove('flex');
    });

    function resetPostureSession() {
      currentStep = 1;
      frontSnapshot = null;
      sagittalSnapshot = null;
      document.getElementById('stepTitle').innerText = 'STEP 1: 正面立位の撮影';
      document.getElementById('stepCounter').innerText = '1 / 2';
      document.getElementById('guideInstruction').innerText = '全身を中心線に合わせてリラックスして立ってください';
    }

    document.getElementById('resetBtn').addEventListener('click', resetPostureSession);
  </script>
</body>
</html>
