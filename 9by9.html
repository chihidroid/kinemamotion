  <script>
    // --- ズーム（ピンチイン/アウト・ダブルタップ）のJavaScriptインターセプト ---
    // iOS Safariでメタタグを無視してズームされるのを完全に防止
    document.addEventListener('gesturestart', function(e) {
      e.preventDefault();
    }, { passive: false });

    document.addEventListener('gesturechange', function(e) {
      e.preventDefault();
    }, { passive: false });

    document.addEventListener('gestureend', function(e) {
      e.preventDefault();
    }, { passive: false });

    // 2本指タップズーム抑止
    document.addEventListener('touchstart', function(e) {
      if (e.touches.length > 1) {
        e.preventDefault();
      }
    }, { passive: false });

    let lastTouchEnd = 0;
    document.addEventListener('touchend', function(e) {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) {
        e.preventDefault(); // ダブルタップズーム防止
      }
      lastTouchEnd = now;
    }, { passive: false });

    // --- アプリケーションロジック ---
    const TOTAL_QUESTIONS = 10;
    let selectedDans = [2, 3, 4, 5];
    let currentQuestions = [];
    let currentIndex = 0;
    let currentAnswerInput = "";
    let userResults = [];
    let isProcessing = false;
    let soundEnabled = true;

    // Web Audio API
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('soundIcon').innerText = soundEnabled ? '🔊' : '🔇';
      document.getElementById('soundText').innerText = soundEnabled ? 'おとON' : 'おとOFF';
      if (soundEnabled) initAudio();
    }

    function playCorrectSound() {
      if (!soundEnabled) return;
      initAudio();
      try {
        const now = audioCtx.currentTime;
        playTone(1318.51, now, 0.18, 'sine', 0.25); // E6
        playTone(1975.53, now + 0.12, 0.35, 'sine', 0.25); // B6
      } catch (e) {}
    }

    function playWrongSound() {
      if (!soundEnabled) return;
      initAudio();
      try {
        const now = audioCtx.currentTime;
        playTone(160, now, 0.14, 'triangle', 0.3);
        playTone(130, now + 0.15, 0.28, 'triangle', 0.35);
      } catch (e) {}
    }

    function playTapSound() {
      if (!soundEnabled) return;
      initAudio();
      try {
        playTone(600, audioCtx.currentTime, 0.04, 'sine', 0.1);
      } catch (e) {}
    }

    function playFanfareSound() {
      if (!soundEnabled) return;
      initAudio();
      try {
        const now = audioCtx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          playTone(freq, now + idx * 0.1, 0.22, 'triangle', 0.2);
        });
        playTone(1046.50, now + 0.42, 0.55, 'sine', 0.3);
      } catch (e) {}
    }

    function playTone(freq, startTime, duration, type = 'sine', maxVol = 0.2) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, startTime);
      gain.gain.setValueAtTime(0.001, startTime);
      gain.gain.exponentialRampToValueAtTime(maxVol, startTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(startTime);
      osc.stop(startTime + duration + 0.05);
    }

    // 学習データ保存
    const STORAGE_KEY = 'kuku_chick_stats_v2';
    function getStoredStats() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      const initStats = {};
      for (let i = 1; i <= 9; i++) initStats[i] = { attempts: 0, correct: 0 };
      return initStats;
    }

    function saveStats(results) {
      const stats = getStoredStats();
      results.forEach(item => {
        const dan = item.a;
        if (!stats[dan]) stats[dan] = { attempts: 0, correct: 0 };
        stats[dan].attempts += 1;
        if (item.isCorrect) stats[dan].correct += 1;
      });
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(stats)); } catch (e) {}
      updateHistorySummary();
    }

    function resetStats() {
      if (confirm("これまでの れんしゅうきろく をリセットしますか？")) {
        localStorage.removeItem(STORAGE_KEY);
        updateHistorySummary();
      }
    }

    function updateHistorySummary() {
      const stats = getStoredStats();
      let totalAttempts = 0;
      let totalCorrect = 0;
      for (let i = 1; i <= 9; i++) {
        totalAttempts += stats[i].attempts;
        totalCorrect += stats[i].correct;
      }
      const el = document.getElementById('historySummary');
      if (totalAttempts === 0) {
        el.innerText = "まだ れんしゅうデータがありません";
      } else {
        const rate = Math.round((totalCorrect / totalAttempts) * 100);
        el.innerText = `累計 ${totalAttempts}問中 ${totalCorrect}問せいかい（正答率 ${rate}%）`;
      }
    }

    // 段選択パネル
    function renderDanCheckboxes() {
      const container = document.getElementById('danCheckboxContainer');
      container.innerHTML = '';
      for (let d = 1; d <= 9; d++) {
        const isChecked = selectedDans.includes(d);
        const label = document.createElement('label');
        label.className = `flex items-center justify-center gap-1.5 p-2 rounded-xl border-2 cursor-pointer font-black text-xs md:text-sm ${
          isChecked ? 'bg-pink-100 border-pink-400 text-pink-600 shadow-sm' : 'bg-white border-gray-200 text-gray-400'
        }`;
        label.innerHTML = `
          <input type="checkbox" value="${d}" ${isChecked ? 'checked' : ''} onchange="onDanCheckboxChange()" class="accent-pink-500 w-4 h-4 pointer-events-none">
          <span>${d}のだん</span>
        `;
        label.onclick = (e) => {
          e.preventDefault();
          if (selectedDans.includes(d)) {
            selectedDans = selectedDans.filter(v => v !== d);
          } else {
            selectedDans.push(d);
            selectedDans.sort((a,b) => a-b);
          }
          renderDanCheckboxes();
          validateDanSelection();
        };
        container.appendChild(label);
      }
    }

    function selectDanPreset(type) {
      if (type === '2-5') selectedDans = [2, 3, 4, 5];
      else if (type === 'all') selectedDans = [1, 2, 3, 4, 5, 6, 7, 8, 9];
      renderDanCheckboxes();
      validateDanSelection();
    }

    function validateDanSelection() {
      const warning = document.getElementById('danWarning');
      if (selectedDans.length === 0) {
        warning.classList.remove('hidden');
        return false;
      }
      warning.classList.add('hidden');
      return true;
    }

    function startGame() {
      if (!validateDanSelection()) return;
      initAudio();

      currentQuestions = [];
      for (let i = 0; i < TOTAL_QUESTIONS; i++) {
        const a = selectedDans[Math.floor(Math.random() * selectedDans.length)];
        const b = Math.floor(Math.random() * 9) + 1;
        currentQuestions.push({ a, b, answer: a * b });
      }

      currentIndex = 0;
      currentAnswerInput = "";
      userResults = [];
      isProcessing = false;

      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('resultScreen').classList.add('hidden');
      document.getElementById('quizScreen').classList.remove('hidden');

      renderProgressDots();
      loadQuestion(currentIndex);
    }

    function renderProgressDots() {
      const container = document.getElementById('progressDots');
      container.innerHTML = '';
      for (let i = 0; i < TOTAL_QUESTIONS; i++) {
        const dot = document.createElement('div');
        dot.id = `dot-${i}`;
        dot.className = 'w-2.5 h-2.5 rounded-full bg-gray-200 transition-all';
        container.appendChild(dot);
      }
    }

    function updateProgressDots() {
      for (let i = 0; i < TOTAL_QUESTIONS; i++) {
        const dot = document.getElementById(`dot-${i}`);
        if (!dot) continue;
        if (i < currentIndex) {
          dot.className = userResults[i].isCorrect ? 'w-2.5 h-2.5 rounded-full bg-emerald-400' : 'w-2.5 h-2.5 rounded-full bg-rose-400';
        } else if (i === currentIndex) {
          dot.className = 'w-2.5 h-2.5 rounded-full bg-[#FF70A6] ring-2 ring-pink-200 animate-pulse';
        } else {
          dot.className = 'w-2.5 h-2.5 rounded-full bg-gray-200';
        }
      }
    }

    function loadQuestion(idx) {
      const q = currentQuestions[idx];
      document.getElementById('questionCounter').innerText = `${idx + 1} / ${TOTAL_QUESTIONS}`;
      document.getElementById('num1').innerText = q.a;
      document.getElementById('num2').innerText = q.b;
      
      currentAnswerInput = "";
      updateAnswerDisplay();
      updateProgressDots();

      const cheers = ["がんばるピヨ〜！✨", "落ち着いてけいさんピヨ🐣", "キミならできるピヨ！🌟", "九九マスターまであと少し！", "ぴよぴよ応援中〜！🐥"];
      document.getElementById('cheerBubble').innerText = cheers[Math.floor(Math.random() * cheers.length)];
    }

    function updateAnswerDisplay() {
      const display = document.getElementById('answerDisplay');
      if (currentAnswerInput.length === 0) {
        display.innerHTML = `<span id="cursor" class="animate-pulse text-pink-300 text-2xl">|</span>`;
      } else {
        display.innerText = currentAnswerInput;
      }
    }

    function handleNumInput(numStr) {
      if (isProcessing) return;
      playTapSound();
      if (currentAnswerInput.length >= 3) return;
      currentAnswerInput += numStr;
      updateAnswerDisplay();
    }

    function handleNumBackspace() {
      if (isProcessing) return;
      playTapSound();
      if (currentAnswerInput.length > 0) {
        currentAnswerInput = currentAnswerInput.slice(0, -1);
        updateAnswerDisplay();
      }
    }

    function handleNumClear() {
      if (isProcessing) return;
      playTapSound();
      currentAnswerInput = "";
      updateAnswerDisplay();
    }

    function submitAnswer() {
      if (isProcessing) return;
      if (currentAnswerInput.trim() === "") {
        const display = document.getElementById('answerDisplay');
        display.classList.add('animate-bounce');
        setTimeout(() => display.classList.remove('animate-bounce'), 400);
        return;
      }

      isProcessing = true;
      const q = currentQuestions[currentIndex];
      const userNum = parseInt(currentAnswerInput, 10);
      const isCorrect = (userNum === q.answer);

      userResults.push({
        a: q.a,
        b: q.b,
        correctAnswer: q.answer,
        userAnswer: userNum,
        isCorrect: isCorrect
      });

      const overlay = document.getElementById('instantFeedbackOverlay');
      const icon = document.getElementById('feedbackIcon');
      const text = document.getElementById('feedbackText');

      if (isCorrect) {
        playCorrectSound();
        icon.innerText = "⭕️";
        text.innerText = "せいかい！ピヨ✨";
        text.className = "text-2xl md:text-3xl font-black text-pink-500";
      } else {
        playWrongSound();
        icon.innerText = "❌";
        text.innerText = "ぶぶー！ピヨ…";
        text.className = "text-2xl md:text-3xl font-black text-gray-500";
      }

      overlay.classList.remove('hidden');

      setTimeout(() => {
        overlay.classList.add('hidden');
        currentIndex++;
        if (currentIndex < TOTAL_QUESTIONS) {
          isProcessing = false;
          loadQuestion(currentIndex);
        } else {
          showResultScreen();
        }
      }, 800);
    }

    function showResultScreen() {
      document.getElementById('quizScreen').classList.add('hidden');
      document.getElementById('resultScreen').classList.remove('hidden');

      saveStats(userResults);

      const correctCount = userResults.filter(r => r.isCorrect).length;
      const score = correctCount * 10;
      document.getElementById('finalScore').innerText = score;

      const chick = document.getElementById('resultChick');
      const comment = document.getElementById('resultComment');

      if (score === 100) {
        chick.innerText = "👑🐣🎉";
        comment.innerText = "100てん満点！かんぺきピヨ〜！！すごすぎるピヨ！✨";
        playFanfareSound();
        if (typeof confetti === 'function') {
          confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
        }
      } else if (score >= 80) {
        chick.innerText = "🐣💖";
        comment.innerText = "おしい！とってもじょうずピヨ！あと少しで満点！";
      } else if (score >= 50) {
        chick.innerText = "🐣🌱";
        comment.innerText = "よくがんばったピヨ！まちがえたところをふくしゅうしよう！";
      } else {
        chick.innerText = "🐣🐾";
        comment.innerText = "いっしょに ゆっくり れんしゅうしていこうピヨ！応援してるよ！";
      }

      const reviewContainer = document.getElementById('reviewList');
      reviewContainer.innerHTML = '';
      userResults.forEach((item, i) => {
        const card = document.createElement('div');
        card.className = `p-2 rounded-xl border flex items-center justify-between text-xs ${
          item.isCorrect ? 'bg-white border-pink-100' : 'bg-rose-50 border-rose-200'
        }`;
        card.innerHTML = `
          <div class="flex items-center gap-1.5">
            <span class="text-sm">${item.isCorrect ? '⭕️' : '❌'}</span>
            <span class="font-bold font-fredoka text-gray-700">${item.a} × ${item.b} =</span>
            ${item.isCorrect 
              ? `<span class="font-black text-pink-600 font-fredoka">${item.correctAnswer}</span>` 
              : `<span class="line-through text-gray-400 font-bold">${item.userAnswer}</span> <span class="text-[11px] text-rose-500 font-black">（せいかい: ${item.correctAnswer}）</span>`
            }
          </div>
          <span class="text-[9px] font-bold text-gray-400">#${i + 1}</span>
        `;
        reviewContainer.appendChild(card);
      });

      renderWeakDanAnalysis();
    }

    function renderWeakDanAnalysis() {
      const stats = getStoredStats();
      const analysisEl = document.getElementById('weakDanAnalysis');
      
      let danRates = [];
      for (let d = 1; d <= 9; d++) {
        if (stats[d].attempts > 0) {
          const rate = Math.round((stats[d].correct / stats[d].attempts) * 100);
          danRates.push({ dan: d, rate, attempts: stats[d].attempts, correct: stats[d].correct });
        }
      }

      if (danRates.length === 0) {
        analysisEl.innerHTML = "<p>データがまだありません。</p>";
        return;
      }

      const sorted = [...danRates].sort((a, b) => a.rate - b.rate);
      const lowest = sorted[0];

      let adviceHtml = "";
      if (lowest && lowest.rate < 80) {
        adviceHtml = `<div class="mb-2 p-2 bg-white rounded-xl border border-pink-200 text-pink-700 font-bold text-xs">💡 <strong>${lowest.dan}の段</strong>でミスが出やすい傾向があります（正答率 ${lowest.rate}%）。ここを重点練習するとグンと伸びます！</div>`;
      } else {
        adviceHtml = `<div class="mb-2 p-2 bg-white rounded-xl border border-emerald-200 text-emerald-700 font-bold text-xs">✨ 全体的にとてもよく解けています！この調子で得意な段を増やしましょう！</div>`;
      }

      let badgesHtml = `<div class="grid grid-cols-3 sm:grid-cols-5 gap-1 mt-1.5">`;
      for (let d = 1; d <= 9; d++) {
        const data = stats[d];
        if (data.attempts === 0) {
          badgesHtml += `<div class="p-1 bg-gray-100 rounded-lg text-center text-[10px] text-gray-400">${d}の段: -</div>`;
        } else {
          const r = Math.round((data.correct / data.attempts) * 100);
          const color = r >= 80 ? 'bg-emerald-100 text-emerald-700' : (r >= 50 ? 'bg-amber-100 text-amber-700' : 'bg-rose-100 text-rose-700');
          badgesHtml += `<div class="p-1 ${color} rounded-lg text-center font-bold text-[10px]">${d}の段: ${r}%</div>`;
        }
      }
      badgesHtml += `</div>`;

      analysisEl.innerHTML = adviceHtml + badgesHtml;
    }

    function goToStart() {
      document.getElementById('resultScreen').classList.add('hidden');
      document.getElementById('quizScreen').classList.add('hidden');
      document.getElementById('startScreen').classList.remove('hidden');
      updateHistorySummary();
    }

    function quitToStart() {
      if (confirm("スタートがめんにもどるピヨ？")) {
        goToStart();
      }
    }

    // 物理キーボード対応
    window.addEventListener('keydown', (e) => {
      const quizScreen = document.getElementById('quizScreen');
      if (quizScreen.classList.contains('hidden') || isProcessing) return;

      if (e.key >= '0' && e.key <= '9') {
        e.preventDefault();
        handleNumInput(e.key);
      } else if (e.key === 'Backspace') {
        e.preventDefault();
        handleNumBackspace();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        submitAnswer();
      } else if (e.key === 'Escape' || e.key.toLowerCase() === 'c') {
        e.preventDefault();
        handleNumClear();
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      renderDanCheckboxes();
      updateHistorySummary();
    });
  </script>
</body>
</html>
